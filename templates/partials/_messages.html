{# Django messages rendered as dismissible Tailwind toasts. #}
{% if messages %}
<div class="fixed top-16 right-4 z-50 space-y-2 w-80 max-w-[90vw]">
    {% for message in messages %}
    <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)"
         class="flex items-start gap-2 px-4 py-3 rounded shadow text-sm text-white
                {% if message.tags == 'success' %}bg-emerald-600
                {% elif message.tags == 'error' %}bg-red-600
                {% elif message.tags == 'warning' %}bg-amber-500
                {% else %}bg-gray-700{% endif %}">
        <span class="flex-1">{{ message }}</span>
        <button @click="show = false" class="opacity-80 hover:opacity-100" aria-label="Dismiss">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
