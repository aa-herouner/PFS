{% extends 'base.html' %}

{% block title %}Log in · Poultry Farm Record System{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <h1 class="text-xl font-semibold text-gray-900 mb-4">Log in</h1>

    {% if form.errors %}
    <p class="text-sm text-red-600 mb-3">Your username and password didn't match. Please try again.</p>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                {{ field.label }}
            </label>
            <input type="{% if field.name == 'password' %}password{% else %}text{% endif %}"
                   name="{{ field.name }}" id="{{ field.id_for_label }}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-emerald-500 focus:border-emerald-500"
                   {% if field.field.required %}required{% endif %}>
        </div>
        {% endfor %}
        <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded">
            Log in
        </button>
    </form>
</div>
{% endblock %}
